[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptiq-context-intelligence"
version = "0.1.0"
description = "SynaptIQ Context Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.7.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
